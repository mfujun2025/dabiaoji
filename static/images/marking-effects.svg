<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 350" role="img" aria-labelledby="meT meD" font-family="system-ui, 'Microsoft YaHei', 'PingFang SC', sans-serif">
<title id="meT">光纤激光打标机六种典型标记效果对比</title>
<desc id="meD">同一台 1064nm 光纤激光打标机通过调整参数可得到六种效果：打白（浅色氧化）、打黑（深色氧化）、彩色打标（MOPA 脉宽可调）、深雕去料、二维码追溯码、塑料发泡凸起。</desc>
<defs>
  <linearGradient id="gRainbow" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2f7fd1"/>
    <stop offset="0.22" stop-color="#7b5cf0"/>
    <stop offset="0.45" stop-color="#c8437f"/>
    <stop offset="0.68" stop-color="#d93b26"/>
    <stop offset="0.86" stop-color="#c99a1f"/>
    <stop offset="1" stop-color="#2f9e63"/>
  </linearGradient>
  <clipPath id="cSample"><rect x="0" y="0" width="234" height="86" rx="6"/></clipPath>
</defs>

<!-- ============ 第 1 行 ============ -->

<!-- 1 打白 -->
<g>
  <rect x="20" y="20" width="262" height="150" rx="10" fill="#ffffff" stroke="#dfe5ec"/>
  <rect x="34" y="34" width="234" height="86" rx="6" fill="#3f4b5a"/>
  <text x="151" y="92" text-anchor="middle" font-size="44" font-weight="800" letter-spacing="2" fill="#e9eff6">LM</text>
  <text x="34" y="144" font-size="15" font-weight="700" fill="#1b3252">打白 · 浅色氧化</text>
  <text x="34" y="162" font-size="12" fill="#7b8794">低频率 / 高重叠 / 快扫</text>
</g>

<!-- 2 打黑 -->
<g>
  <rect x="299" y="20" width="262" height="150" rx="10" fill="#ffffff" stroke="#dfe5ec"/>
  <rect x="313" y="34" width="234" height="86" rx="6" fill="#c9d3de"/>
  <text x="430" y="92" text-anchor="middle" font-size="44" font-weight="800" letter-spacing="2" fill="#141c26">LM</text>
  <text x="313" y="144" font-size="15" font-weight="700" fill="#1b3252">打黑 · 深色氧化</text>
  <text x="313" y="162" font-size="12" fill="#7b8794">低频率 / 慢速 / 高能量密度</text>
</g>

<!-- 3 彩色打标 -->
<g>
  <rect x="578" y="20" width="262" height="150" rx="10" fill="#ffffff" stroke="#dfe5ec"/>
  <rect x="592" y="34" width="234" height="86" rx="6" fill="#b6c3d3"/>
  <text x="709" y="92" text-anchor="middle" font-size="38" font-weight="800" letter-spacing="1" fill="url(#gRainbow)">LM-2026</text>
  <text x="592" y="144" font-size="15" font-weight="700" fill="#1b3252">彩色打标 · MOPA</text>
  <text x="592" y="162" font-size="12" fill="#7b8794">脉宽可调，氧化膜厚度产生干涉色</text>
</g>

<!-- ============ 第 2 行 ============ -->

<!-- 4 深雕 -->
<g>
  <rect x="20" y="186" width="262" height="150" rx="10" fill="#ffffff" stroke="#dfe5ec"/>
  <rect x="34" y="200" width="234" height="86" rx="6" fill="#b9c6d4"/>
  <text x="151" y="258" text-anchor="middle" font-size="44" font-weight="800" letter-spacing="2" fill="#eef3f9" opacity="0.85" transform="translate(1.8,1.8)">LM</text>
  <text x="151" y="258" text-anchor="middle" font-size="44" font-weight="800" letter-spacing="2" fill="#5d6d80" opacity="0.7" transform="translate(-1.6,-1.6)">LM</text>
  <text x="151" y="258" text-anchor="middle" font-size="44" font-weight="800" letter-spacing="2" fill="#93a3b5">LM</text>
  <text x="34" y="310" font-size="15" font-weight="700" fill="#1b3252">深雕 · 去除材料</text>
  <text x="34" y="328" font-size="12" fill="#7b8794">多道重复走线，深度 0.05–0.3mm</text>
</g>

<!-- 5 二维码 -->
<g>
  <rect x="299" y="186" width="262" height="150" rx="10" fill="#ffffff" stroke="#dfe5ec"/>
  <rect x="313" y="200" width="234" height="86" rx="6" fill="#e8eef5"/>
  <g fill="#1b2330">
    <rect x="398" y="212" width="21" height="21"/>
    <rect x="440" y="212" width="21" height="21"/>
    <rect x="398" y="254" width="21" height="21"/>
    <path d="M426 226h7v7h-7z M426 233h7v7h-7z M440 233h7v7h-7z M419 240h7v7h-7z M433 240h7v7h-7z M447 240h7v7h-7z M426 247h7v7h-7z M440 247h7v7h-7z M454 247h7v7h-7z M426 254h7v7h-7z M440 254h7v7h-7z M419 261h7v7h-7z M433 261h7v7h-7z M447 261h7v7h-7z M426 268h7v7h-7z M440 268h7v7h-7z M454 268h7v7h-7z"/>
  </g>
  <text x="313" y="310" font-size="15" font-weight="700" fill="#1b3252">二维码追溯码</text>
  <text x="313" y="328" font-size="12" fill="#7b8794">以读码率与条码等级判定质量</text>
</g>

<!-- 6 塑料发泡 -->
<g>
  <rect x="578" y="186" width="262" height="150" rx="10" fill="#ffffff" stroke="#dfe5ec"/>
  <rect x="592" y="200" width="234" height="86" rx="6" fill="#2b323c"/>
  <text x="709" y="258" text-anchor="middle" font-size="44" font-weight="800" letter-spacing="2" fill="#5c6673" opacity="0.9" transform="translate(2,2)">LM</text>
  <text x="709" y="258" text-anchor="middle" font-size="44" font-weight="800" letter-spacing="2" fill="#ffffff" opacity="0.5" transform="translate(-1.6,-1.6)">LM</text>
  <text x="709" y="258" text-anchor="middle" font-size="44" font-weight="800" letter-spacing="2" fill="#dfe7f0">LM</text>
  <text x="592" y="310" font-size="15" font-weight="700" fill="#1b3252">塑料发泡 · 凸起</text>
  <text x="592" y="328" font-size="12" fill="#7b8794">热作用使树脂隆起，浅色凸起</text>
</g>
</svg>
