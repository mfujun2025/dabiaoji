<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="opT opD" font-family="system-ui, 'Microsoft YaHei', 'PingFang SC', sans-serif">
<title id="opT">光纤激光打标机光路原理示意</title>
<desc id="opD">光路流程：脉冲光纤激光器输出 1064nm 激光，经输出光纤送入准直镜组整形为平行光束，由反射镜转折向下进入 X/Y 高速振镜，振镜控制光束偏转角度，再穿过 F-θ 场镜聚焦到工件表面，在整个标刻幅面内保持焦点一致。</desc>
<defs>
  <linearGradient id="gLaser" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3d6489"/>
    <stop offset="1" stop-color="#17304e"/>
  </linearGradient>
  <linearGradient id="gMech" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6d8197"/>
    <stop offset="0.35" stop-color="#c0cedd"/>
    <stop offset="1" stop-color="#5f7288"/>
  </linearGradient>
  <linearGradient id="gSteel2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#eaf0f7"/>
    <stop offset="1" stop-color="#aebdcd"/>
  </linearGradient>
</defs>

<!-- 激光器 -->
<rect x="30" y="112" width="142" height="106" rx="10" fill="url(#gLaser)"/>
<rect x="42" y="124" width="118" height="5" rx="2.5" fill="#5fb2ff" opacity="0.45"/>
<text x="101" y="162" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">光纤激光器</text>
<text x="101" y="184" text-anchor="middle" font-size="13" fill="#a8cdf0">1064nm · 30W</text>

<!-- 输出光纤 -->
<path d="M172 167 Q212 167 252 167" stroke="#8fa3b8" stroke-width="8" fill="none" stroke-linecap="round"/>
<path d="M172 167 Q212 167 252 167" stroke="#d3dfec" stroke-width="3" fill="none" stroke-linecap="round"/>

<!-- 准直镜组 -->
<ellipse cx="264" cy="167" rx="9" ry="38" fill="#dbe6f2" stroke="#8fa3b8" stroke-width="2"/>
<rect x="258" y="125" width="12" height="6" rx="3" fill="#5f7288"/>
<rect x="258" y="203" width="12" height="6" rx="3" fill="#5f7288"/>

<!-- 水平光束 -->
<line x1="274" y1="167" x2="414" y2="167" stroke="#e34a30" stroke-width="3.2"/>
<line x1="274" y1="167" x2="414" y2="167" stroke="#ff8a72" stroke-width="1" opacity="0.8"/>

<!-- 45° 转折反射镜 -->
<line x1="400" y1="151" x2="432" y2="183" stroke="#4a5a6e" stroke-width="6" stroke-linecap="round"/>

<!-- 垂直光束 1 -->
<line x1="416" y1="167" x2="416" y2="226" stroke="#e34a30" stroke-width="3.2"/>

<!-- 振镜组 -->
<rect x="372" y="196" width="196" height="66" rx="9" fill="none" stroke="#8fa3b8" stroke-width="1.4" stroke-dasharray="6 5"/>
<text x="372" y="189" font-size="12" fill="#8fa3b8">振镜组</text>

<!-- Y 振镜 -->
<line x1="400" y1="212" x2="432" y2="244" stroke="#4a5a6e" stroke-width="6" stroke-linecap="round"/>
<circle cx="416" cy="228" r="3.5" fill="#d93b26"/>

<!-- 水平光束 2 -->
<line x1="416" y1="228" x2="526" y2="228" stroke="#e34a30" stroke-width="3.2"/>

<!-- X 振镜 -->
<line x1="512" y1="212" x2="544" y2="244" stroke="#4a5a6e" stroke-width="6" stroke-linecap="round"/>
<circle cx="528" cy="228" r="3.5" fill="#d93b26"/>

<!-- 垂直光束 3 -->
<line x1="528" y1="228" x2="528" y2="288" stroke="#e34a30" stroke-width="3.2"/>

<!-- F-θ 场镜 -->
<rect x="496" y="284" width="64" height="14" rx="3" fill="url(#gMech)"/>
<ellipse cx="528" cy="305" rx="26" ry="7" fill="#dbe6f2" stroke="#8fa3b8" stroke-width="2"/>

<!-- 扫描出射光束：三束表示幅面内不同落点 -->
<g stroke="#e34a30" stroke-width="2.2" opacity="0.9">
  <line x1="528" y1="314" x2="470" y2="352"/>
  <line x1="528" y1="314" x2="528" y2="352"/>
  <line x1="528" y1="314" x2="586" y2="352"/>
</g>

<!-- 焦平面与工件 -->
<line x1="404" y1="352" x2="668" y2="352" stroke="#d93b26" stroke-width="1.6" stroke-dasharray="7 5"/>
<rect x="428" y="352" width="204" height="16" rx="3" fill="url(#gSteel2)" stroke="#8b9cad" stroke-width="1"/>
<rect x="448" y="357" width="12" height="6" rx="1.5" fill="#5c6d81" opacity="0.7"/>
<rect x="466" y="357" width="12" height="6" rx="1.5" fill="#5c6d81" opacity="0.7"/>
<rect x="484" y="357" width="30" height="6" rx="1.5" fill="#5c6d81" opacity="0.5"/>
<ellipse cx="528" cy="354" rx="26" ry="4" fill="#d93b26" opacity="0.35"/>

<!-- ============ 标注引线 ============ -->
<g stroke="#16406f" stroke-width="1.3" stroke-dasharray="5 4" fill="none">
  <line x1="582" y1="228" x2="690" y2="228"/>
  <line x1="568" y1="300" x2="690" y2="300"/>
  <line x1="654" y1="360" x2="690" y2="360"/>
</g>

<g font-weight="700">
  <circle cx="582" cy="228" r="11" fill="#16406f"/>
  <text x="582" y="233" text-anchor="middle" fill="#ffffff" font-size="12">4</text>
  <circle cx="568" cy="300" r="11" fill="#16406f"/>
  <text x="568" y="305" text-anchor="middle" fill="#ffffff" font-size="12">5</text>
  <circle cx="654" cy="360" r="11" fill="#16406f"/>
  <text x="654" y="365" text-anchor="middle" fill="#ffffff" font-size="12">6</text>
</g>

<g>
  <text x="700" y="222" font-size="14" font-weight="700" fill="#1b3252">④ X / Y 高速振镜</text>
  <text x="700" y="241" font-size="12" fill="#7b8794">控制光斑在幅面内的落点</text>
  <text x="700" y="294" font-size="14" font-weight="700" fill="#1b3252">⑤ F-θ 场镜</text>
  <text x="700" y="313" font-size="12" fill="#7b8794">全幅面焦点落在同一平面</text>
  <text x="700" y="354" font-size="14" font-weight="700" fill="#1b3252">⑥ 焦平面</text>
  <text x="700" y="373" font-size="12" fill="#7b8794">工件表面</text>
</g>

<g font-size="13" fill="#7b8794">
  <text x="30" y="248">① 脉冲光纤激光器（调 Q 或 MOPA 结构）</text>
  <text x="215" y="130" text-anchor="middle">② 输出光纤</text>
  <text x="264" y="104" text-anchor="middle">③ 准直镜组</text>
</g>
</svg>
